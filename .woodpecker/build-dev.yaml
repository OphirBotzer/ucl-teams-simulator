when:
  - event: push
    branch: develop

steps:
  - name: build
    image: docker:cli
    environment:
      DOCKER_HOST: tcp://docker:2375
    commands:
      - sleep 5
      - ./bash-pipelines-helpers/build-image-dev.sh

  - name: release
    image: docker:cli
    environment:
      DOCKER_HOST: tcp://docker:2375
    commands:
      - ./bash-pipelines-helpers/release-image.sh

services:
  - name: docker
    image: docker:dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ''