when:
  - event: push
    branch: develop

steps:
  - name: build
    image: mcr.microsoft.com/devcontainers/base:bullseye
    commands:
      - ./bash-pipelines-helpers/build-image-dev.sh

  - name: release
    image: mcr.microsoft.com/devcontainers/base:bullseye
    commands:
      - ./bash-pipelines-helpers/release-image.sh