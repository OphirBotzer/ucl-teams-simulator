when:
 - event: push
   branch: develop

steps:
  - name: build
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - pwd
      - ls -la
      - ls -la bash-pipelines-helpers/
      - /bin/sh -c bash-pipelines-helpers/build-image-dev.sh
  - name: release
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - ./bash-pipelines-helpers/release-image.sh